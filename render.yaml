services:
  - type: web
    name: drone-initiative-platform
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
    healthCheckPath: /api/health
    plan: professional
    region: oman
    instanceType: professional
    autoDeploy: true
    disk:
      name: drone-initiative-disk
      mountPath: /opt/render/project/src/server/data
      sizeGB: 10
    packageManager: npm
